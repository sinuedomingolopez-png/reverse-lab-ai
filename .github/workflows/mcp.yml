name: Real MCP protocol and permissions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-wire:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install ".[mcp]" "lief==1.0.0"
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s integration_tests -v

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: python -m pip install ".[mcp]" "lief==1.0.0"
      - name: Download pinned official Ghidra and Rizin with SHA-256 verification
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $native = Join-Path $env:RUNNER_TEMP 'reverse-lab-engines'
          New-Item -ItemType Directory -Path $native -Force | Out-Null
          $ghidraZip = Join-Path $native 'ghidra.zip'
          Invoke-WebRequest 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' -OutFile $ghidraZip
          if ((Get-FileHash $ghidraZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db') { throw 'Ghidra hash mismatch' }
          Expand-Archive -LiteralPath $ghidraZip -DestinationPath $native
          "GHIDRA_HOME=$(Join-Path $native 'ghidra_12.1.4_PUBLIC')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $rizinZip = Join-Path $native 'rizin.zip'
          Invoke-WebRequest 'https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-windows-shared64-v0.9.1.zip' -OutFile $rizinZip
          if ((Get-FileHash $rizinZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '45ffa004e26653eaee8d262b8e6eeae09402a7d319c1f20a2ba794bd6af1cc28') { throw 'Rizin hash mismatch' }
          Expand-Archive -LiteralPath $rizinZip -DestinationPath $native
          (Join-Path $native 'rizin-win-installer-clang_cl-64/bin') | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Real engine outputs and MCP to Ghidra round trip on synthetic files
        run: python -m unittest discover -s integration_tests -v

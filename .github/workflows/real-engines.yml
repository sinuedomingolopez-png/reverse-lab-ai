name: Real analysis engines

on:
  push:
    branches: [main]
    paths:
      - 'reverse_lab/**'
      - 'integration_tests/**'
      - '.github/workflows/real-engines.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'reverse_lab/**'
      - 'integration_tests/**'
      - '.github/workflows/real-engines.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-lief:
    name: LIEF native parse (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install actual LIEF distribution
        run: python -m pip install --only-binary=:all: lief
      - name: Parse synthetic ELF through actual project workflow
        run: python -m reverse_lab.engine_probe --engine lief --output lief-smoke.json
      - name: Publish sanitized LIEF check
        uses: actions/upload-artifact@v4
        with:
          name: lief-engine-smoke-${{ matrix.os }}
          path: lief-smoke.json
          if-no-files-found: error
          retention-days: 14

  real-angr:
    name: angr real CFGFast (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install actual angr distribution
        run: python -m pip install angr
      - name: Analyze synthetic ELF with authentic CFGFast worker
        run: python -m reverse_lab.engine_probe --engine angr --timeout 120 --output angr-smoke.json
      - name: Publish sanitized angr check
        uses: actions/upload-artifact@v4
        with:
          name: angr-real-cfgfast-linux
          path: angr-smoke.json
          if-no-files-found: error
          retention-days: 14

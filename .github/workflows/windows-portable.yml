name: Windows portable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-portable:
    name: Build unsigned Windows portable ZIP
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install portable build tools
        run: python -m pip install "pyinstaller>=6.15,<7"
      - name: Check application tests
        run: python -m unittest discover -s tests -v
      - name: Build EXE, run offline smoke-test and create ZIP
        run: python tools/build_windows.py
      - name: Verify checksum and required smoke-test output
        shell: pwsh
        run: |
          $archive = 'dist/ReverseLabAI-0.9.0-windows-x64.zip'
          $expected = (Get-Content "$archive.sha256" -Raw).Split(' ')[0]
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Portable ZIP checksum mismatch' }
          $report = Get-Content 'dist/portable-smoke.json' -Raw | ConvertFrom-Json
          if ($report.status -ne 'ready' -or !$report.frozen -or $report.ghidra_script_count -ne 3) {
            throw 'Portable EXE integrity smoke-test failed'
          }
      - name: Upload unsigned Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ReverseLabAI-0.9.0-windows-x64
          path: |
            dist/ReverseLabAI-0.9.0-windows-x64.zip
            dist/ReverseLabAI-0.9.0-windows-x64.zip.sha256
            dist/portable-smoke.json
          if-no-files-found: error
          retention-days: 14

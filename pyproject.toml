[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-lab-ai"
version = "0.12.0"
description = "Local static binary inspection and reverse engineering integration lab"
requires-python = ">=3.10"

[project.optional-dependencies]
angr = ["angr"]
lief = ["lief"]
validation = ["lief", "angr"]
mcp = ["mcp==2.3.0; python_version >= '3.11'", "psutil==7.2.2", "pywin32==312; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["reverse_lab*"]

[project.scripts]
reverse-lab = "reverse_lab.cli:main"
reverse-lab-compare = "reverse_lab.report_cli:main_compare"
reverse-lab-explain = "reverse_lab.report_cli:main_explain"
reverse-lab-ghidra-check = "reverse_lab.ghidra_probe:main"
reverse-lab-engine-check = "reverse_lab.engine_probe:main"
reverse-lab-agent = "reverse_lab.agent:main"

[tool.setuptools.package-data]
reverse_lab = ["ghidra_scripts/*.java"]

[project.gui-scripts]
reverse-lab-gui = "reverse_lab.gui:main"

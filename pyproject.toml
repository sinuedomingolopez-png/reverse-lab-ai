[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-lab-ai"
version = "0.1.0"
description = "Local static binary inspection and reverse engineering integration lab"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["reverse_lab*"]

[project.scripts]
reverse-lab = "reverse_lab.cli:main"
